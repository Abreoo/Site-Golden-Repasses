<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teste Upload de Fotos</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 800px;
            margin: 50px auto;
            padding: 20px;
        }
        .upload-area {
            border: 2px dashed #ccc;
            padding: 40px;
            text-align: center;
            margin: 20px 0;
            border-radius: 10px;
        }
        .upload-area:hover {
            border-color: #007bff;
        }
        button {
            background: #007bff;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            margin: 10px;
        }
        button:hover {
            background: #0056b3;
        }
        .preview {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 10px;
            margin: 20px 0;
        }
        .preview img {
            width: 100%;
            height: 150px;
            object-fit: cover;
            border-radius: 5px;
        }
        .progress {
            width: 100%;
            height: 20px;
            background: #f0f0f0;
            border-radius: 10px;
            overflow: hidden;
            margin: 10px 0;
        }
        .progress-bar {
            height: 100%;
            background: #007bff;
            transition: width 0.3s;
        }
        .message {
            padding: 10px;
            margin: 10px 0;
            border-radius: 5px;
        }
        .success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        .error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
    </style>
</head>
<body>
    <h1>🚗 Teste Upload de Fotos - Golden Carros</h1>
    
    <div class="upload-area" id="uploadArea">
        <input type="file" id="fileInput" multiple accept="image/*" style="display: none;">
        <p>📸 Clique aqui ou arraste fotos para fazer upload</p>
        <small>Formatos: JPEG, PNG, WebP (máx 5MB cada)</small>
    </div>

    <div id="preview" class="preview"></div>
    
    <div id="progress" class="progress" style="display: none;">
        <div id="progressBar" class="progress-bar" style="width: 0%"></div>
    </div>

    <button id="uploadBtn" style="display: none;">📤 Enviar Fotos</button>
    
    <div id="message"></div>

    <hr style="margin: 40px 0;">
    
    <h2>📋 Fotos Enviadas</h2>
    <button id="loadPhotosBtn">🔄 Carregar Fotos Existentes</button>
    <div id="photosList"></div>

    <script>
        const fileInput = document.getElementById('fileInput');
        const uploadArea = document.getElementById('uploadArea');
        const preview = document.getElementById('preview');
        const uploadBtn = document.getElementById('uploadBtn');
        const progress = document.getElementById('progress');
        const progressBar = document.getElementById('progressBar');
        const message = document.getElementById('message');
        const photosList = document.getElementById('photosList');
        const loadPhotosBtn = document.getElementById('loadPhotosBtn');
        
        let selectedFiles = [];

        // Upload area click
        uploadArea.addEventListener('click', () => fileInput.click());

        // File selection
        fileInput.addEventListener('change', (e) => {
            selectedFiles = Array.from(e.target.files);
            showPreview();
        });

        // Drag and drop
        uploadArea.addEventListener('dragover', (e) => {
            e.preventDefault();
            uploadArea.style.borderColor = '#007bff';
        });

        uploadArea.addEventListener('dragleave', () => {
            uploadArea.style.borderColor = '#ccc';
        });

        uploadArea.addEventListener('drop', (e) => {
            e.preventDefault();
            uploadArea.style.borderColor = '#ccc';
            selectedFiles = Array.from(e.dataTransfer.files);
            showPreview();
        });

        function showPreview() {
            preview.innerHTML = '';
            selectedFiles.forEach((file, index) => {
                if (file.type.startsWith('image/')) {
                    const reader = new FileReader();
                    reader.onload = (e) => {
                        const div = document.createElement('div');
                        div.innerHTML = `
                            <img src="${e.target.result}" alt="${file.name}">
                            <p style="font-size: 12px; margin: 5px 0;">${file.name}</p>
                            <p style="font-size: 10px; color: #666;">${(file.size / 1024 / 1024).toFixed(2)} MB</p>
                        `;
                        preview.appendChild(div);
                    };
                    reader.readAsDataURL(file);
                }
            });
            
            uploadBtn.style.display = selectedFiles.length > 0 ? 'block' : 'none';
        }

        // Upload button
        uploadBtn.addEventListener('click', async () => {
            if (selectedFiles.length === 0) {
                showMessage('Selecione pelo menos uma foto', 'error');
                return;
            }

            const formData = new FormData();
            selectedFiles.forEach(file => {
                formData.append('photos', file);
            });

            progress.style.display = 'block';
            uploadBtn.disabled = true;

            try {
                const xhr = new XMLHttpRequest();
                
                xhr.upload.addEventListener('progress', (e) => {
                    if (e.lengthComputable) {
                        const percentComplete = (e.loaded / e.total) * 100;
                        progressBar.style.width = percentComplete + '%';
                    }
                });

                xhr.addEventListener('load', () => {
                    if (xhr.status === 201) {
                        const response = JSON.parse(xhr.responseText);
                        showMessage(`✅ ${response.length} fotos enviadas com sucesso!`, 'success');
                        selectedFiles = [];
                        preview.innerHTML = '';
                        uploadBtn.style.display = 'none';
                        fileInput.value = '';
                        loadExistingPhotos();
                    } else {
                        const error = JSON.parse(xhr.responseText);
                        showMessage(`❌ Erro: ${error.error || 'Falha no upload'}`, 'error');
                    }
                    progress.style.display = 'none';
                    progressBar.style.width = '0%';
                    uploadBtn.disabled = false;
                });

                xhr.addEventListener('error', () => {
                    showMessage('❌ Erro de conexão', 'error');
                    progress.style.display = 'none';
                    progressBar.style.width = '0%';
                    uploadBtn.disabled = false;
                });

                xhr.open('POST', '/api/cars/1/photos');
                xhr.send(formData);

            } catch (error) {
                showMessage('❌ Erro no upload', 'error');
                progress.style.display = 'none';
                uploadBtn.disabled = false;
            }
        });

        function showMessage(text, type) {
            message.innerHTML = `<div class="message ${type}">${text}</div>`;
            setTimeout(() => {
                message.innerHTML = '';
            }, 5000);
        }

        // Load existing photos
        loadPhotosBtn.addEventListener('click', loadExistingPhotos);

        async function loadExistingPhotos() {
            try {
                const response = await fetch('/api/cars/1/photos');
                if (response.ok) {
                    const photos = await response.json();
                    photosList.innerHTML = photos.map(photo => `
                        <div style="border: 1px solid #ddd; padding: 10px; margin: 10px 0; border-radius: 5px;">
                            <img src="${photo.url}" style="width: 100px; height: 100px; object-fit: cover; border-radius: 5px;">
                            <p><strong>${photo.originalName}</strong></p>
                            <p style="font-size: 12px; color: #666;">${(photo.size / 1024 / 1024).toFixed(2)} MB</p>
                            <p style="font-size: 10px; color: ${photo.isMain ? 'green' : '#666'};">
                                ${photo.isMain ? '⭐ Foto Principal' : 'Foto Secundária'}
                            </p>
                            <button onclick="deletePhoto('${photo.id}')" style="background: #dc3545; margin-top: 5px;">🗑️ Excluir</button>
                        </div>
                    `).join('');
                }
            } catch (error) {
                showMessage('❌ Erro ao carregar fotos', 'error');
            }
        }

        async function deletePhoto(photoId) {
            if (confirm('Tem certeza que deseja excluir esta foto?')) {
                try {
                    const response = await fetch(`/api/photos/${photoId}`, { method: 'DELETE' });
                    if (response.ok) {
                        showMessage('✅ Foto excluída com sucesso', 'success');
                        loadExistingPhotos();
                    } else {
                        showMessage('❌ Erro ao excluir foto', 'error');
                    }
                } catch (error) {
                    showMessage('❌ Erro ao excluir foto', 'error');
                }
            }
        }

        // Load photos on page load
        loadExistingPhotos();
    </script>
</body>
</html>
